# ==========================================
# MONOCHROME LIGHT (KITTY)
# ==========================================

font_family          JetBrainsMono Nerd Font
font_size            12.0
window_padding_width 27

background_opacity          0.9
dynamic_background_opacity  yes

background            #C98B73
foreground            #120C0B
selection_background  #2B1B17
selection_foreground  #F1E9E4

cursor                #2B1B17
cursor_text_color     #F1E9E4

cursor_shape          beam
cursor_beam_thickness 5.0
cursor_blink_interval 0.5

cursor_trail 3
cursor_trail_decay 0.1 0.4

active_tab_background   #2B1B17
active_tab_foreground   #F1E9E4
inactive_tab_background #D59A80
inactive_tab_foreground #120C0B
