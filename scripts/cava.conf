[general]
bars = 54
framerate = 30
# autosens: 1 = normal, 2 = aggressive sensitivity ramping
autosens = 2
overshoot = 20
sensitivity = 100
# Expand frequency range to catch human voice/commentary (80Hz - 3.5kHz) and music (sub-bass up to treble)
lower_cutoff_freq = 40
higher_cutoff_freq = 12000

[input]
method = pipewire

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
channels = mono

[smoothing]
monstercat = 1
waves = 0
noise_reduction = 40

[eq]
# Boost low-mids and vocal frequencies so YouTube speech, movies, and dialog trigger the visualizer evenly alongside music
1 = 1.0 # sub-bass / bass
2 = 1.3 # mid-bass
3 = 1.6 # speech / vocal fundamental range (200Hz - 1kHz)
4 = 1.4 # vocal harmonics / presence (1kHz - 4kHz)
5 = 1.1 # treble
